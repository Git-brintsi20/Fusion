          - "System calculates and displays charge breakdown (BR-HM-064)"
          - "Student acknowledges charges and submits"
          - "System validates eligibility (BR-HM-061) and records application as Pending"
          - "Caretaker/Warden reviews application; verifies authorization authenticity (BR-HM-066)"
          - "Room availability confirmed for vacation period (BR-HM-067)"
          - "Application approved; student notified with stay details"
          - "System reserves room; charge notification sent (BR-HM-073)"
          - "Student pays within deadline"
          - "System coordinates mess, cleaning, and security services (BR-HM-074)"
          - "During stay: presence monitored; no violations detected"
          - "Stay period ends; system updates occupancy; completion report generated"
        expected_final_state: "Extended stay completed; charges paid; room released; stay record archived; no violations; comprehensive report generated"

