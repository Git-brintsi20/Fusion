  - id: "HM-WF-113"
    title: "Extended Stay During Vacations Management Workflow"
    description: "Student applies for extended stay → Caretaker/Warden approves → System manages room reservation, charges, services, presence monitoring, and violations."
    trigger: "Student initiates HM-UC-038: Apply for Extended Stay"
    actors: ["Student", "Caretaker", "Warden", "System"]
    preconditions:
      - "Student is logged in with active hostel accommodation"
      - "Institute vacation period is declared in system"
      - "Student has obtained faculty authorization"
      - "Caretaker/Warden has appropriate permissions"
    end_states:
      - "END-1: Extended Stay Completed Successfully"
      - "END-2: Application Rejected"
      - "END-3: Application Cancelled by Student"
      - "END-4: Stay Terminated Due to Violations"
    referenced_brs: ["BR-HM-061", "BR-HM-062", "BR-HM-063", "BR-HM-064", "BR-HM-065", "BR-HM-066", "BR-HM-067", "BR-HM-073", "BR-HM-074"]

    e2e_tests:
      - scenario: "Student applies with valid authorization; approved; pays charges; completes stay without violations"
