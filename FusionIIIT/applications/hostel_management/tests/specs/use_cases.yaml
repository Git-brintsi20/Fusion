        input_action: "POST /hostel/guest-room/booking/{id}/cancel with confirmation"
        expected_result: "Booking status updated to Cancelled; room reservation released; Caretaker notified"

    exception_paths:
      - scenario: "Check-out date is same as or before check-in date"
        preconditions: "Student fills booking form"
        input_action: "POST /hostel/guest-room/booking with check_out_date <= check_in_date"
        expected_result: "Validation error per BR-HM-052; booking not submitted"
      - scenario: "No guest rooms available for selected dates"
        preconditions: "All rooms booked for the requested dates"
        input_action: "GET /hostel/guest-room/availability?check_in=X&check_out=Y"
        expected_result: "'No rooms available' displayed; alternative dates suggested"
      - scenario: "Booking duration exceeds 7 consecutive nights"
        preconditions: "Student selects dates beyond maximum stay"
        input_action: "POST /hostel/guest-room/booking with stay_duration > 7 nights"
        expected_result: "Rejected per BR-HM-055; suggests splitting into multiple bookings"
      - scenario: "Booking requested less than 2 days in advance"
        preconditions: "Student submits booking for tomorrow"
        input_action: "POST /hostel/guest-room/booking with check_in_date within 2 days"
        expected_result: "Rejected per BR-HM-054 unless emergency override by Caretaker"

  - id: "HM-UC-037"
    title: "Approve and Manage Booking"
    description: "Caretaker reviews guest room booking requests, verifies eligibility and availability, approves/rejects, manages check-in/check-out, handles damages and fines."
    actors: "Primary: Caretaker, Secondary: Student, System"
    preconditions: "Caretaker is logged in and assigned to the relevant hostel; at least one booking request exists or approved booking requires processing."
    referenced_brs: ["BR-HM-051", "BR-HM-056", "BR-HM-057", "BR-HM-058", "BR-HM-059"]

    happy_paths:
      - scenario: "Caretaker approves booking; guest checks in and out without damages"
        preconditions: "Booking is Pending; student is eligible; room is available"
        input_action: "PATCH /hostel/guest-room/booking/{id} with status=Approved, then check-in and check-out"
        expected_result: "Booking approved; room reserved; guest checked in with ID verification; room inspected; booking completed with status=Completed; room marked Available"
      - scenario: "Caretaker rejects booking with detailed reason"
        preconditions: "Student ineligible or room unavailable"
        input_action: "PATCH /hostel/guest-room/booking/{id} with status=Rejected, reason, comments"
        expected_result: "Booking rejected; student notified with reason; room remains available"

    alternate_paths:
      - scenario: "Damages found at check-out; fine imposed"
        preconditions: "Room inspection reveals damage"
        input_action: "POST /hostel/fine with damage_details, photos, estimated_cost linked to booking"
        expected_result: "Fine created and linked to booking; student notified; booking status=Completed with Damages"

    exception_paths:
      - scenario: "Guest identity verification fails at check-in"
        preconditions: "Guest presents invalid or missing ID"
        input_action: "POST /hostel/guest-room/booking/{id}/checkin with id_verification=failed"
        expected_result: "Check-in denied; student contacted for clarification; booking may be cancelled if unresolved"

  - id: "HM-UC-038"
    title: "Apply for Extended Stay"
    description: "Student submits request for staying in hostel during institute vacation periods with faculty authorization letter, charge acknowledgment, and status tracking."
    actors: "Primary: Student, Secondary: Caretaker, Warden, System"
    preconditions: "Student is logged in with active hostel accommodation; vacation period is declared; no pending extended stay request for same period."
    referenced_brs: ["BR-HM-061", "BR-HM-062", "BR-HM-063", "BR-HM-064", "BR-HM-065"]

    happy_paths:
      - scenario: "Student submits extended stay application with valid authorization and acknowledges charges"
        preconditions: "Student meets eligibility per BR-HM-061; vacation period is active in system"
        input_action: "POST /hostel/extended-stay with vacation_period_id, start_date, end_date, reason, authorization_file, terms_acknowledged=true"
        expected_result: "Charges calculated and displayed; application recorded with status=Pending; Caretaker/Warden notified; acknowledgment sent to student"

    alternate_paths:
      - scenario: "Student modifies pending application with new authorization"
        preconditions: "Application status is Pending and more than 48 hours before stay"
        input_action: "PATCH /hostel/extended-stay/{id} with updated dates or new authorization"
        expected_result: "Application updated; reset to Pending; staff notified of modification"
      - scenario: "Student cancels approved application before stay start date"
        preconditions: "Application is Approved; stay has not started"
        input_action: "POST /hostel/extended-stay/{id}/cancel with reason, confirmation"
        expected_result: "Status updated to Cancelled; room reservation released; Caretaker/Warden notified"

    exception_paths:
      - scenario: "Selected dates are outside declared vacation period"
        preconditions: "Student selects dates beyond vacation window"
        input_action: "POST /hostel/extended-stay with dates outside vacation period"
        expected_result: "Validation error per BR-HM-062; application not submitted"
      - scenario: "No faculty authorization uploaded"
        preconditions: "Student fills form without uploading authorization"
        input_action: "POST /hostel/extended-stay with authorization_file=null"
        expected_result: "Validation error per BR-HM-063.a; application blocked"
      - scenario: "Authorization file exceeds 5MB or wrong format"
        preconditions: "Student uploads oversized or wrong format file"
        input_action: "POST /hostel/extended-stay with file.size > 5MB or format not in [PDF,JPG,PNG]"
        expected_result: "Upload rejected per BR-HM-063.d; student prompted to reupload"

  - id: "HM-UC-039"
    title: "Review and Approve Application"
    description: "Caretaker or Warden reviews extended stay applications, verifies faculty authorization, checks room availability, reviews conduct, and approves or rejects."
    actors: "Primary: Caretaker, Warden, Secondary: Student, System"
    preconditions: "Caretaker/Warden is logged in; assigned to relevant hostel; at least one extended stay application with status=Pending exists."
    referenced_brs: ["BR-HM-061", "BR-HM-066", "BR-HM-067"]

    happy_paths:
      - scenario: "Caretaker/Warden verifies valid authorization and approves application"
        preconditions: "Authorization is valid; room is available; student conduct is acceptable"
        input_action: "PATCH /hostel/extended-stay/{id}/decision with decision=Approved, comments=optional"
        expected_result: "Application status updated to Approved; student notified with stay details and charges; room reserved for vacation period"

    alternate_paths:
      - scenario: "Emergency application flagged for expedited review"
        preconditions: "Application is marked Urgent/Emergency"
        input_action: "GET /hostel/extended-stay/{id} with urgency_flag=true"
        expected_result: "Warden receives immediate notification; expedited review initiated; temporary approval may be granted pending full authorization within 48 hours"
      - scenario: "Student appeals rejected application; Warden reviews"
        preconditions: "Application is Rejected; student submits appeal with new evidence"
        input_action: "POST /hostel/extended-stay/{id}/appeal with evidence, justification"
        expected_result: "Warden reviews appeal; makes final decision (uphold or overturn); student notified; Warden decision is final"

    exception_paths:
      - scenario: "Authorization appears invalid or forged"
        preconditions: "Reviewer detects suspicious authorization"
        input_action: "POST /hostel/extended-stay/{id}/flag-authorization with reason"
        expected_result: "Authorization marked Invalid per BR-HM-066.d; student contacted; application may be rejected or resubmission requested; disciplinary action initiated if forgery confirmed"
      - scenario: "Room not available due to maintenance or capacity reached"
        preconditions: "No rooms available during vacation period"
        input_action: "GET /hostel/extended-stay/{id}/room-availability"
        expected_result: "No Availability warning per BR-HM-067; alternative dates suggested or rejection with reason"

  - id: "HM-UC-040"
    title: "Manage Extended Stay Operations"
    description: "System automatically reserves rooms, calculates charges, tracks payments, coordinates services, monitors presence, handles violations, and generates reports for extended stay students."
    actors: "Primary: System, Secondary: Caretaker, Warden, Student"
    preconditions: "Extended stay application is approved; vacation period dates are configured; charges and policies configured; payment tracking system is operational."
    referenced_brs: ["BR-HM-064", "BR-HM-073", "BR-HM-074"]

    happy_paths:
      - scenario: "System completes full extended stay operations lifecycle"
        preconditions: "Application is Approved; payment received; no violations"
        input_action: "SYSTEM EVENT: application.status = Approved"
        expected_result: "Room reserved; charges calculated and communicated; payment confirmed; services coordinated; presence monitored; stay completed; room released; reports generated"

    alternate_paths:
      - scenario: "Service plans adjusted when extended stay count changes"
        preconditions: "Students cancel or new approvals added during vacation"
        input_action: "SYSTEM EVENT: approved_count changes"
        expected_result: "Mess, cleaning, and security services adjusted to match new expected count per BR-HM-074"

    exception_paths:
      - scenario: "Payment not received by deadline; approval revoked"
        preconditions: "Payment deadline reached with payment_status != Paid"
        input_action: "SYSTEM CHECK: payment deadline per BR-HM-073.d"
        expected_result: "Final warning sent 24 hours before revocation; approval automatically revoked on stay start date; room reservation released"
      - scenario: "Major violation during stay; extended stay terminated"
        preconditions: "Serious rule violation reported"
        input_action: "POST /hostel/extended-stay/{id}/violation with severity=Major"
        expected_result: "Violation recorded; fine imposed; stay terminated; student asked to vacate immediately; violation affects future eligibility"
